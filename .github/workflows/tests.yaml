name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: mailwaechter
      - run: node --test ../tests/pruefen.test.js ../tests/waechter.test.js
        working-directory: mailwaechter
