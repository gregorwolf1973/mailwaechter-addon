name: Mailwächter
version: "0.2.0"
slug: mailwaechter
# Fertige Abbilder aus der GitHub-Registrierung (sonst baut jedes Geraet selbst)
image: ghcr.io/gregorwolf1973/{arch}-addon-mailwaechter
description: Überwacht das Gmail-Postfach per IMAP IDLE, prüft jede neue Mail auf Betrug und verschiebt gefährliche Mails
url: https://github.com/gregorwolf1973/mailwaechter-addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Fuer die Benachrichtigung ueber einen HA-Dienst (notify.*)
homeassistant_api: true
# Die Oberflaeche gibt es NUR hier (Ingress) - kein Port nach draussen
ingress: true
ingress_port: 8099
panel_icon: mdi:email-lock
panel_title: Mailwächter
panel_admin: true
options:
  gmail_adresse: ""
  app_passwort: ""
  benachrichtigung: ""
  melden_bei: rot
  nur_melden: false
  eigene_domains: []
  geschuetzte_namen: []
  bekannte_domains: []
  rdap: true
  sperrlisten: true
  log_level: info
schema:
  gmail_adresse: email?
  app_passwort: password?
  benachrichtigung: str?
  melden_bei: list(rot|gelb)
  nur_melden: bool
  eigene_domains:
    - str
  geschuetzte_namen:
    - str
  bekannte_domains:
    - str
  rdap: bool
  sperrlisten: bool
  log_level: list(debug|info|warning|error)
